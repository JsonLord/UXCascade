[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.41.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.7.0",
    "browser-use>=0.11.12",
    "langchain-anthropic>=1.3.4",
    "beautifulsoup4>=4.14.3",
    "anthropic>=0.83.0",
    "boto3>=1.42.56",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
